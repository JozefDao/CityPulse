services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: citypulse
      MYSQL_USER: citypulse
      MYSQL_PASSWORD: citypulse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${CITYPULSE_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
